<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="270" viewBox="0 0 1584 270" role="img" aria-labelledby="title desc">
  <title id="title">Delaem Digital operating model</title>
  <desc id="desc">Build internally, prove, document, template, sell and improve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070A"/><stop offset="1" stop-color="#080C12"/></linearGradient>
    <style>.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}</style>
  </defs>
  <rect width="1584" height="270" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1582" height="268" rx="23" fill="none" stroke="#94A3B8" stroke-opacity="0.12"/>
  <text x="64" y="55" class="mono" fill="#B8794B" font-size="14" font-weight="700" letter-spacing="3.2">DD OPERATING MODEL</text>
  <text x="64" y="91" class="sans" fill="#F5F7FB" font-size="25" font-weight="700">We build on ourselves first. Then we turn evidence into a product.</text>
  <g transform="translate(64 166)">
    <line x1="0" y1="0" x2="1450" y2="0" stroke="#94A3B8" stroke-opacity="0.18" stroke-width="2"/>
    <line x1="0" y1="0" x2="1160" y2="0" stroke="#7FA6D6" stroke-opacity="0.45" stroke-width="2.4"/>
    <line x1="1160" y1="0" x2="1450" y2="0" stroke="#B8794B" stroke-opacity="0.75" stroke-width="2.8"/>
    <g class="mono" font-size="13" font-weight="700" letter-spacing="1.5">
      <g><circle cx="0" cy="0" r="6" fill="#080C12" stroke="#7FA6D6" stroke-width="2"/><text x="0" y="38" text-anchor="start" fill="#7F8B9C">BUILD FOR DD</text></g>
      <g><circle cx="290" cy="0" r="6" fill="#080C12" stroke="#7FA6D6" stroke-width="2"/><text x="290" y="38" text-anchor="middle" fill="#7F8B9C">PROVE</text></g>
      <g><circle cx="580" cy="0" r="6" fill="#080C12" stroke="#7FA6D6" stroke-width="2"/><text x="580" y="38" text-anchor="middle" fill="#7F8B9C">DOCUMENT</text></g>
      <g><circle cx="870" cy="0" r="6" fill="#080C12" stroke="#7FA6D6" stroke-width="2"/><text x="870" y="38" text-anchor="middle" fill="#7F8B9C">TEMPLATE</text></g>
      <g><circle cx="1160" cy="0" r="6" fill="#B8794B"/><text x="1160" y="38" text-anchor="middle" fill="#B8C1CE">SELL</text></g>
      <g><circle cx="1450" cy="0" r="6" fill="#080C12" stroke="#B8794B" stroke-width="2"/><text x="1450" y="38" text-anchor="end" fill="#B8794B">IMPROVE</text></g>
    </g>
  </g>
</svg>