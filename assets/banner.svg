    <text x="0" y="128" fill="#F5F7FB" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="70" font-weight="800" letter-spacing="-2.5">Vitaly Timoshenko</text>
    <text x="2" y="178" fill="#B8C1CE" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500">Founder · Delaem Digital</text>
    <text x="2" y="222" fill="#7FA6D6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="2.2">CLIENTFLOW SYSTEM · AI · DIGITAL PRODUCTS</text>

