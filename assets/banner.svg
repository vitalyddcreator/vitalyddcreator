    <text x="0" y="304" class="sans" fill="#B8794B" font-size="70" font-weight="800" letter-spacing="-3.2">INTO CLIENTS.</text>
    <text x="2" y="358" class="mono" fill="#7F8B9C" font-size="15" font-weight="700" letter-spacing="2.6">AI · LEAD GENERATION · CRM · AUTOMATION · PRODUCT ENGINEERING</text>
