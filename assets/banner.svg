      <circle cx="0" cy="0" r="5" fill="#B8794B"/>
      <circle cx="204" cy="0" r="5" fill="#5F8ED8"/>
      <circle cx="408" cy="0" r="5" fill="#5F8ED8"/>
      <circle cx="612" cy="0" r="5" fill="#6FBF91"/>
      <text x="0" y="30" fill="#7F8B9C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">IDEA</text>
      <text x="190" y="30" fill="#7F8B9C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">SYSTEM</text>
      <text x="386" y="30" fill="#7F8B9C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">PRODUCTION</text>
      <text x="590" y="30" fill="#7F8B9C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">IMPACT</text>
