<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="560" viewBox="0 0 1584 560" role="img" aria-labelledby="title desc">
  <title id="title">Vitaly Timoshenko — Founder &amp; CEO, Delaem Digital</title>
  <desc id="desc">Dark architectural founder banner for Delaem Digital and ClientFlow System.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070A"/>
      <stop offset="0.62" stop-color="#080C12"/>
      <stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <radialGradient id="copperAtmos" cx="86%" cy="52%" r="44%">
      <stop offset="0" stop-color="#B8794B" stop-opacity="0.14"/>
      <stop offset="0.48" stop-color="#B8794B" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#B8794B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="steelAtmos" cx="63%" cy="100%" r="54%">
      <stop offset="0" stop-color="#7FA6D6" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#7FA6D6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:'Courier New',monospace}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
      @keyframes pulse{0%{transform:scale(.65);opacity:.55}65%,100%{transform:scale(2.2);opacity:0}}
      @media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}}
    </style>
  </defs>
  <rect width="1584" height="560" rx="32" fill="url(#bg)"/>
  <rect width="1584" height="560" rx="32" fill="url(#copperAtmos)"/>
  <rect width="1584" height="560" rx="32" fill="url(#steelAtmos)"/>
  <rect x="1" y="1" width="1582" height="558" rx="31" fill="none" stroke="#94A3B8" stroke-opacity="0.11"/>
