    <path d="M34 260 C168 128 286 120 432 148" fill="none" stroke="#B8794B" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="54" cy="214" r="8" fill="#080C12" stroke="#5F8ED8" stroke-width="2"/>
    <circle cx="182" cy="122" r="8" fill="#080C12" stroke="#5F8ED8" stroke-width="2"/>
