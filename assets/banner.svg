<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="460" viewBox="0 0 1584 460" role="img" aria-labelledby="title desc">
  <title id="title">Vitaly Timoshenko — Founder and CEO of Delaem Digital</title>
  <desc id="desc">Minimal black and red editorial founder banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080B"/>
      <stop offset="0.58" stop-color="#0A0C10"/>
      <stop offset="1" stop-color="#090A0D"/>
    </linearGradient>
    <radialGradient id="ember" cx="86%" cy="48%" r="48%">
      <stop offset="0" stop-color="#D33A32" stop-opacity="0.16"/>
      <stop offset="0.48" stop-color="#D33A32" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#D33A32" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#FFFFFF" stroke-opacity="0.026" stroke-width="1"/>
    </pattern>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D33A32"/>
      <stop offset="1" stop-color="#7C1715"/>
    </linearGradient>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif}
      .mono{font-family:"Courier New",monospace}
    </style>
  </defs>

  <rect width="1584" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1584" height="460" rx="28" fill="url(#ember)"/>
  <rect width="1584" height="460" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1582" height="458" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.075"/>

  <g transform="translate(82 76)">
    <rect x="0" y="0" width="46" height="4" rx="2" fill="#D33A32"/>
    <text x="0" y="46" class="mono" fill="#9AA3AF" font-size="14" font-weight="700" letter-spacing="3.4">VITALY TIMOSHENKO / FOUNDER &amp; CEO</text>

    <text x="0" y="135" class="sans" fill="#F7F8FA" font-size="72" font-weight="800" letter-spacing="-3.4">DELAEM DIGITAL</text>
    <text x="0" y="200" class="sans" fill="#B8BEC8" font-size="31" font-weight="500" letter-spacing="-0.5">Client systems. AI. Product infrastructure.</text>

    <g transform="translate(0 252)">
      <text x="0" y="0" class="mono" fill="#D33A32" font-size="14" font-weight="700" letter-spacing="2.7">BUILD</text>
      <text x="84" y="0" class="mono" fill="#626A75" font-size="14" font-weight="700">→</text>
      <text x="120" y="0" class="mono" fill="#C7CCD3" font-size="14" font-weight="700" letter-spacing="2.7">CONNECT</text>
      <text x="232" y="0" class="mono" fill="#626A75" font-size="14" font-weight="700">→</text>
      <text x="268" y="0" class="mono" fill="#C7CCD3" font-size="14" font-weight="700" letter-spacing="2.7">MEASURE</text>
      <text x="388" y="0" class="mono" fill="#626A75" font-size="14" font-weight="700">→</text>
      <text x="424" y="0" class="mono" fill="#F7F8FA" font-size="14" font-weight="700" letter-spacing="2.7">IMPROVE</text>
    </g>
  </g>

  <g transform="translate(1120 44)">
    <path d="M120 16 L224 16 L108 328 L4 328 Z" fill="url(#slash)" opacity="0.94"/>
    <path d="M252 16 H422 L392 98 H327 L241 328 H138 Z" fill="#F7F8FA" fill-opacity="0.92"/>
    <text x="218" y="380" text-anchor="middle" class="mono" fill="#8B929D" font-size="12" font-weight="700" letter-spacing="3.2">VT / 01</text>
  </g>

  <text x="1502" y="424" text-anchor="end" class="mono" fill="#6C737E" font-size="11" font-weight="700" letter-spacing="3.1">SYSTEMS THAT BRING CLIENTS</text>
</svg>