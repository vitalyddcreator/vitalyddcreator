<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Vitaly Timoshenko — Founder, Delaem Digital</title>
  <desc id="desc">Premium dark Delaem Digital profile banner with ClientFlow system motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070A"/>
      <stop offset="0.58" stop-color="#080C12"/>
      <stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="82%" cy="42%" r="48%">
      <stop offset="0" stop-color="#5F8ED8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5F8ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperGlow" cx="18%" cy="74%" r="36%">
      <stop offset="0" stop-color="#B8794B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#B8794B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="28" fill="url(#blueGlow)"/>
  <rect width="1600" height="420" rx="28" fill="url(#copperGlow)"/>
  <rect width="1600" height="420" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1598" height="418" rx="27" fill="none" stroke="#94A3B8" stroke-opacity="0.14"/>

