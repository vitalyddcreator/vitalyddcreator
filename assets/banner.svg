    <line x1="1040" y1="0" x2="1040" y2="560"/><line x1="1198" y1="0" x2="1198" y2="560"/><line x1="1356" y1="0" x2="1356" y2="560"/><line x1="1514" y1="0" x2="1514" y2="560"/>
  </g>
