<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="250" viewBox="0 0 1584 250" role="img" aria-labelledby="title desc">
  <title id="title">ClientFlow System</title>
  <desc id="desc">Brand to improvement flow used by Delaem Digital.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080C12"/><stop offset="1" stop-color="#05070A"/></linearGradient>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}
      .p{transform-box:fill-box;transform-origin:center;animation:p 2.6s ease-out infinite}
      @keyframes p{0%{transform:scale(.7);opacity:.55}70%,100%{transform:scale(2.25);opacity:0}}
      @media (prefers-reduced-motion:reduce){.p{animation:none;opacity:0}}
    </style>
  </defs>
  <rect width="1584" height="250" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1582" height="248" rx="23" fill="none" stroke="#94A3B8" stroke-opacity="0.12"/>
  <text x="64" y="55" class="mono" fill="#B8794B" font-size="14" font-weight="700" letter-spacing="3.2">CLIENTFLOW SYSTEM</text>
  <text x="64" y="91" class="sans" fill="#F5F7FB" font-size="25" font-weight="700">One connected route from attention to measurable growth.</text>
  <g transform="translate(64 158)">
    <line x1="0" y1="0" x2="1450" y2="0" stroke="#94A3B8" stroke-opacity="0.18" stroke-width="2"/>
    <line x1="0" y1="0" x2="1244" y2="0" stroke="#7FA6D6" stroke-opacity="0.52" stroke-width="2.5"/>
    <line x1="1244" y1="0" x2="1450" y2="0" stroke="#B8794B" stroke-opacity="0.74" stroke-width="2.8"/>
    <g class="mono" font-size="14" font-weight="700" letter-spacing="1.5">
      <g><circle cx="0" cy="0" r="6" fill="#080C12" stroke="#7FA6D6" stroke-width="2"/><text x="0" y="38" text-anchor="start" fill="#7F8B9C">BRAND</text></g>
      <g><circle cx="205" cy="0" r="6" fill="#080C12" stroke="#7FA6D6" stroke-width="2"/><text x="205" y="38" text-anchor="middle" fill="#7F8B9C">SITE</text></g>
      <g><circle cx="410" cy="0" r="6" fill="#080C12" stroke="#7FA6D6" stroke-width="2"/><text x="410" y="38" text-anchor="middle" fill="#7F8B9C">TRAFFIC</text></g>
      <g><circle cx="615" cy="0" r="6" fill="#080C12" stroke="#7FA6D6" stroke-width="2"/><text x="615" y="38" text-anchor="middle" fill="#7F8B9C">LEAD</text></g>
      <g><circle cx="820" cy="0" r="6" fill="#080C12" stroke="#7FA6D6" stroke-width="2"/><text x="820" y="38" text-anchor="middle" fill="#7F8B9C">CRM</text></g>
      <g><circle cx="1025" cy="0" r="6" fill="#080C12" stroke="#7FA6D6" stroke-width="2"/><text x="1025" y="38" text-anchor="middle" fill="#7F8B9C">PROCESSING</text></g>
      <g><circle cx="1244" cy="0" r="6" fill="#B8794B"/><circle class="p" cx="1244" cy="0" r="8" fill="none" stroke="#B8794B" stroke-width="2"/><text x="1244" y="38" text-anchor="middle" fill="#B8C1CE">ANALYTICS</text></g>
      <g><circle cx="1450" cy="0" r="6" fill="#080C12" stroke="#B8794B" stroke-width="2"/><text x="1450" y="38" text-anchor="end" fill="#B8794B">IMPROVE</text></g>
    </g>
  </g>
</svg>