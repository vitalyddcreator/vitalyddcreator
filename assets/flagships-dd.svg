<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="560" viewBox="0 0 1584 560" role="img" aria-labelledby="title desc">
  <title id="title">Delaem Digital flagship solutions</title>
  <desc id="desc">Делаем Трафик, Делаем Продажи, Делаем Систему and Сопровождение.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010101"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <style>
      .meta{font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:4px}
      .name{font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:-1px}
      .desc{font-family:Arial,Helvetica,sans-serif;font-weight:600;letter-spacing:1.2px}
    </style>
  </defs>

  <rect width="1584" height="560" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1582" height="558" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <rect x="62" y="50" width="46" height="4" rx="2" fill="#ff111a"/>
  <text x="128" y="61" class="meta" fill="#8f8f94" font-size="16">DELAEM DIGITAL / FLAGSHIP SOLUTIONS / 04</text>

  <line x1="792" y1="110" x2="792" y2="500" stroke="#ffffff" stroke-opacity="0.08"/>
  <line x1="62" y1="305" x2="1522" y2="305" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(62 145)">
    <text x="0" y="0" class="meta" fill="#ff171f" font-size="14">01</text>
    <text x="0" y="66" class="name" fill="#ffffff" font-size="52">ДЕЛАЕМ ТРАФИК</text>
    <text x="0" y="110" class="desc" fill="#97979c" font-size="18">CLIENT ACQUISITION</text>
  </g>

  <g transform="translate(850 145)">
    <text x="0" y="0" class="meta" fill="#ff171f" font-size="14">02</text>
    <text x="0" y="66" class="name" fill="#ffffff" font-size="52">ДЕЛАЕМ ПРОДАЖИ</text>
    <text x="0" y="110" class="desc" fill="#97979c" font-size="18">SALES + CRM</text>
  </g>

  <g transform="translate(62 365)">
    <text x="0" y="0" class="meta" fill="#ff171f" font-size="14">03</text>
    <text x="0" y="66" class="name" fill="#ffffff" font-size="52">ДЕЛАЕМ СИСТЕМУ</text>
    <text x="0" y="110" class="desc" fill="#97979c" font-size="18">DIGITAL / IT SYSTEM</text>
  </g>

  <g transform="translate(850 365)">
    <text x="0" y="0" class="meta" fill="#ff171f" font-size="14">04</text>
    <text x="0" y="66" class="name" fill="#ffffff" font-size="52">СОПРОВОЖДЕНИЕ</text>
    <text x="0" y="110" class="desc" fill="#97979c" font-size="18">OPERATE + IMPROVE</text>
  </g>

  <rect x="62" y="520" width="1460" height="1" fill="#ff171f" opacity="0.34"/>
