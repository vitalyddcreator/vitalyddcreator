<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="630" viewBox="0 0 1584 630" role="img" aria-labelledby="title desc">
  <title id="title">Delaem Digital product ecosystem</title>
  <desc id="desc">Selected products and systems built inside Delaem Digital.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070A"/><stop offset="1" stop-color="#080C12"/></linearGradient>
    <radialGradient id="a" cx="10%" cy="0%" r="70%"><stop offset="0" stop-color="#B8794B" stop-opacity="0.075"/><stop offset="1" stop-color="#B8794B" stop-opacity="0"/></radialGradient>
    <style>.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}</style>
  </defs>
  <rect width="1584" height="630" rx="28" fill="url(#bg)"/>
  <rect width="1584" height="630" rx="28" fill="url(#a)"/>
  <rect x="1" y="1" width="1582" height="628" rx="27" fill="none" stroke="#94A3B8" stroke-opacity="0.11"/>
  <text x="68" y="62" class="mono" fill="#B8794B" font-size="14" font-weight="700" letter-spacing="3.2">DELAEM DIGITAL / PRODUCT ECOSYSTEM</text>
  <text x="68" y="106" class="sans" fill="#F5F7FB" font-size="31" font-weight="700">One company. Multiple systems. Shared product intelligence.</text>
  <text x="68" y="140" class="sans" fill="#7F8B9C" font-size="18">Built as products with clear boundaries — connected by identity, analytics, CRM, support and revenue infrastructure.</text>
  <g stroke="#94A3B8" stroke-opacity="0.12" stroke-width="1">
    <line x1="68" y1="194" x2="1516" y2="194"/><line x1="68" y1="390" x2="1516" y2="390"/><line x1="430" y1="194" x2="430" y2="570"/><line x1="792" y1="194" x2="792" y2="570"/><line x1="1154" y1="194" x2="1154" y2="570"/><line x1="68" y1="570" x2="1516" y2="570"/>
  </g>
  <g transform="translate(68 228)">
    <text class="mono" fill="#7FA6D6" font-size="13" font-weight="700" letter-spacing="2">01 / GROWTH CORE</text><text y="42" class="sans" fill="#F5F7FB" font-size="29" font-weight="700">ClientFlow Growth</text><text y="79" class="sans" fill="#7F8B9C" font-size="16">Evidence-first lead generation, audits</text><text y="105" class="sans" fill="#7F8B9C" font-size="16">and qualification patterns.</text>
  </g>
  <g transform="translate(456 228)">
    <text class="mono" fill="#7FA6D6" font-size="13" font-weight="700" letter-spacing="2">02 / NETWORK</text><text y="42" class="sans" fill="#F5F7FB" font-size="29" font-weight="700">Сеть.</text><text y="79" class="sans" fill="#7F8B9C" font-size="16">Portable personal network platform</text><text y="105" class="sans" fill="#7F8B9C" font-size="16">for experts, teams and business.</text>
  </g>
  <g transform="translate(818 228)">
    <text class="mono" fill="#7FA6D6" font-size="13" font-weight="700" letter-spacing="2">03 / INFRASTRUCTURE</text><text y="42" class="sans" fill="#F5F7FB" font-size="29" font-weight="700">Хост.</text><text y="79" class="sans" fill="#7F8B9C" font-size="16">Telegram-first servers, domains</text><text y="105" class="sans" fill="#7F8B9C" font-size="16">and automated provisioning.</text>
  </g>
  <g transform="translate(1180 228)">
    <text class="mono" fill="#7FA6D6" font-size="13" font-weight="700" letter-spacing="2">04 / CREATIVE</text><text y="42" class="sans" fill="#F5F7FB" font-size="29" font-weight="700">Креатив.</text><text y="79" class="sans" fill="#7F8B9C" font-size="16">Ad creative production with</text><text y="105" class="sans" fill="#7F8B9C" font-size="16">strategy, generation and QA.</text>
  </g>
  <g transform="translate(68 424)">
    <text class="mono" fill="#B8794B" font-size="13" font-weight="700" letter-spacing="2">05 / AI OPERATIONS</text><text y="42" class="sans" fill="#F5F7FB" font-size="29" font-weight="700">Буст. Мастер.</text><text y="79" class="sans" fill="#7F8B9C" font-size="16">AI-native PC diagnostics, safe</text><text y="105" class="sans" fill="#7F8B9C" font-size="16">repair, verification and rollback.</text>
  </g>
  <g transform="translate(456 424)">
    <text class="mono" fill="#B8794B" font-size="13" font-weight="700" letter-spacing="2">06 / DISTRIBUTION</text><text y="42" class="sans" fill="#F5F7FB" font-size="29" font-weight="700">Эфир.</text><text y="79" class="sans" fill="#7F8B9C" font-size="16">Distribution &amp; Relationship OS</text><text y="105" class="sans" fill="#7F8B9C" font-size="16">across owned channels and outreach.</text>
  </g>
  <g transform="translate(818 424)">
    <text class="mono" fill="#B8794B" font-size="13" font-weight="700" letter-spacing="2">07 / COMMERCE</text><text y="42" class="sans" fill="#F5F7FB" font-size="29" font-weight="700">Витрина.</text><text y="79" class="sans" fill="#7F8B9C" font-size="16">Ready online stores and commerce</text><text y="105" class="sans" fill="#7F8B9C" font-size="16">factory for businesses.</text>
  </g>
  <g transform="translate(1180 424)">
    <text class="mono" fill="#B8794B" font-size="13" font-weight="700" letter-spacing="2">08 / EDUCATION</text><text y="42" class="sans" fill="#F5F7FB" font-size="29" font-weight="700">Симбиоз</text><text y="79" class="sans" fill="#7F8B9C" font-size="16">AI-native School Operating System</text><text y="105" class="sans" fill="#7F8B9C" font-size="16">for experts and online schools.</text>
  </g>
  <text x="1516" y="602" text-anchor="end" class="mono" fill="#7F8B9C" fill-opacity="0.64" font-size="12" font-weight="700" letter-spacing="2.5">BUILD → PROVE → PRODUCTIZE → SCALE</text>
</svg>